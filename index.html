<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Personal Finance Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f4f6f8}
header{background:#2c3e50;color:#fff;padding:15px;text-align:center}
.container{padding:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}
.card1{background:#26eb95;padding:20px;border-radius:8px;text-align:center}
.card2{background:#db7b21;padding:20px;border-radius:8px;text-align:center}
.card3{background:#21a9db;padding:20px;border-radius:8px;text-align:center}
.tabs{display:flex;margin-top:20px}
.tabs button{flex:1;padding:12px;border:none;cursor:pointer;background:#ddd}
.tabs button.active{background:#3498db;color:#fff}
.tab-content{display:none;background:#fff;padding:15px;margin-top:10px;border-radius:8px}
.tab-content.active{display:block}
form{display:grid;gap:10px}
input,select,textarea,button{padding:10px}
button.submit{background:#3498db;color:#fff;border:none;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#f1f1f1}
.actions button{margin:2px;cursor:pointer}
canvas{margin-top:25px}
canvas{
  margin-top:25px;
  max-width: 600px;   /* optional */
  max-height: 400px;  /* optional */
}
.container{display:none}
/* Increase amount font size in summary cards */
.cards p {
  font-size: 32px;   /* change size as you like */
  font-weight: bold;
  margin: 10px 0;
}

/* Optional: slightly bigger headings */
.cards h3 {
  font-size: 20px;
}


</style>
</head>

<body>

<header><h1>Personal Finance Tracker</h1></header>

<div id="loginBox" style="max-width:300px;margin:50px auto;text-align:center">
  <h3>Login</h3>
  <input id="email" type="email" placeholder="Email"><br><br>
  <input id="password" type="password" placeholder="Password"><br><br>
  <button onclick="login()">Login</button>
</div>


<div class="container">

<div class="cards">
  <div class="card1"><h3>Total Income</h3><p id="totalIncome">₹0</p></div>
  <div class="card2"><h3>Total Expense</h3><p id="totalExpense">₹0</p></div>
<div class="card3"><h3>Total Savings</h3><p id="totalSavings">₹0</p>
 <small>
    Net: <span id="netSavings">₹0</span><br>
    Savings: <span id="savedSavings">₹0</span>
  </small>
</div>
 </div>

<div class="tabs">
  <button class="active" onclick="openTab('income',event)">Income</button>
  <button onclick="openTab('expense',event)">Expense</button>
  <button onclick="openTab('savings',event)">Savings</button>
  <button onclick="openTab('reports',event)">Reports</button>
</div>

<div id="income" class="tab-content active"></div>
<div id="expense" class="tab-content"></div>
<div id="savings" class="tab-content"></div>
<div id="reports" class="tab-content"></div>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
  const firebaseConfig = {
  apiKey: "AIzaSyDGzM2_zFXt6utVGzyE_8zNndMxkLiQ6_A",
  authDomain: "finance-ad66c.firebaseapp.com",
  projectId: "finance-ad66c",
  storageBucket: "finance-ad66c.firebasestorage.app",
  messagingSenderId: "894236411158",
  appId: "1:894236411158:web:9e26699719b94de0fd7c37"
};

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const auth = firebase.auth();

function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  firebase.auth().signInWithEmailAndPassword(email, password)
    .then(() => {
      document.getElementById("loginBox").style.display = "none";
      document.querySelector(".container").style.display = "block";
    })
    .catch(err => alert(err.message));
}


firebase.auth().onAuthStateChanged(user => {
  if(user){
    console.log("Logged in UID:", user.uid);
    document.getElementById("loginBox").style.display = "none";
    document.querySelector(".container").style.display = "block";
  } else {
    document.getElementById("loginBox").style.display = "block";
    document.querySelector(".container").style.display = "none";
  }
});

/* ---------------- DATA ---------------- */

let data={income:[],expense:[],savings:[]};
let editIndex=null, editType=null;
let charts = {}; // hold Chart.js instances so we can destroy before redraw

// 🔥 LOAD DATA FROM FIREBASE
firebase.database().ref("financeData").on("value", snapshot => {
  const fbData = snapshot.val() || {};

  data = {
    income: fbData.income || [],
    expense: fbData.expense || [],
    savings: fbData.savings || []
  };

  updateUI();
});

let categories = {
 income:["Salary","Business","Bonus","Other"],
 expense:["Food","Rent","Travel","Bills","Shopping","Other"],
 savings:["Investment","FD","RD","Emergency","Other"]
};

// Load saved categories from localStorage (if any)
try {
 const saved = JSON.parse(localStorage.getItem('financeCategories'));
 if (saved && typeof saved === 'object') {
  // merge saved categories, prefer saved values when present
  categories = Object.assign({}, categories, saved);
 }
} catch(e){
 console.warn('Could not parse saved categories', e);
} 


/* ---------------- TABS ---------------- */

function openTab(tab,e){
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
 document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
 e.target.classList.add('active');
 document.getElementById(tab).classList.add('active');
 if(tab==="reports") renderReports();
}

/* ---------------- FORM ---------------- */

function formHTML(type){
 return `
 <h2>${editType===type?"Edit":"Add"} ${type}</h2>
 <form onsubmit="submitForm(event,'${type}')">
  <input id="${type}-name" placeholder="Name" required>
  <input id="${type}-amount" type="number" placeholder="Amount" required>

  <select id="${type}-category" onchange="checkNewCategory('${type}')">
   ${categories[type].map(c=>`<option value="${c}">${c}</option>`).join("")}
   <option value="__add__">➕ Add New Category</option>
  </select>

  <input id="${type}-date" type="date" required>
  <textarea id="${type}-remarks" placeholder="Remarks"></textarea>
  <button class="submit">${editType===type?"Update":"Save"}</button>
 </form>
 <table id="${type}Table"></table>`;
}

["income","expense","savings"].forEach(t=>{
 document.getElementById(t).innerHTML=formHTML(t);
});

/* ---------------- CATEGORY HANDLER ---------------- */

function checkNewCategory(type){
 const sel=document.getElementById(type+"-category");
 if(sel.value==="__add__"){
  const newCat=prompt("Enter new category name:");
  if(newCat){
   categories[type].push(newCat);
   localStorage.financeCategories=JSON.stringify(categories);
   document.getElementById(type).innerHTML=formHTML(type);
   document.getElementById(type+"-category").value=newCat;
  }else{
   sel.selectedIndex=0;
  }
 }
}

/* ---------------- CRUD ---------------- */

function submitForm(e,type){
 e.preventDefault();
 const obj={
  name:document.getElementById(type+"-name").value,
  amount:+document.getElementById(type+"-amount").value,
  category:document.getElementById(type+"-category").value,
  date:document.getElementById(type+"-date").value,
  remarks:document.getElementById(type+"-remarks").value
 };

 if(editIndex!==null && editType===type){
  data[type][editIndex]=obj;
  editIndex=null; editType=null;
 }else{
  data[type].push(obj);
 }

 save();
 document.getElementById(type).innerHTML=formHTML(type);
}

function editEntry(type,i){
 editIndex=i; editType=type;
 const d=data[type][i];

 document.getElementById(type+"-name").value=d.name;
 document.getElementById(type+"-amount").value=d.amount;
 document.getElementById(type+"-category").value=d.category;
 document.getElementById(type+"-date").value=d.date;
 document.getElementById(type+"-remarks").value=d.remarks;
}

function deleteEntry(type,i){
 if(confirm("Delete this record?")){
  data[type].splice(i,1);
  save();
 }
}

/* ---------------- UI ---------------- */

function save(){
  firebase.database().ref("financeData").update({
    income: data.income,
    expense: data.expense,
    savings: data.savings
  });
}



function updateUI(){
 ["income","expense","savings"].forEach(type=>{
  let html=`<tr>
   <th>Name</th><th>Amount</th><th>Category</th>
   <th>Date</th><th>Remarks</th><th>Actions</th></tr>`;

  data[type].forEach((d,i)=>{
   html+=`<tr>
    <td>${d.name}</td>
    <td>₹${d.amount}</td>
    <td>${d.category}</td>
    <td>${d.date}</td>
    <td>${d.remarks}</td>
    <td class="actions">
     <button onclick="editEntry('${type}',${i})">✏️</button>
     <button onclick="deleteEntry('${type}',${i})">🗑️</button>
    </td>
   </tr>`;
  });

  document.getElementById(type+"Table").innerHTML=html;
 });

 document.getElementById('totalIncome').innerText = "₹"+sum("income");
 document.getElementById('totalExpense').innerText = "₹"+sum("expense");
 const netSavings = sum("income") - sum("expense");
const savedAmount = sum("savings");
document.getElementById('netSavings').innerText = "₹" + netSavings;
document.getElementById('savedSavings').innerText = "₹" + savedAmount;
document.getElementById('totalSavings').innerText = "₹" + (netSavings + savedAmount);



}

const sum=t=>data[t].reduce((s,i)=>s+i.amount,0);

/* ---------------- REPORTS ---------------- */

function renderReports(){
 document.getElementById("reports").innerHTML=`
 <h2>Monthly Report</h2>
 <table id="monthlyReport"></table>
 <canvas id="monthlyChart"></canvas>

 <h2 style="margin-top:40px">Yearly Report</h2>
 <table id="yearlyReport"></table>
 <canvas id="yearlyChart"></canvas>

 <button style="margin-top:30px" onclick="exportExcel()">Export Excel</button>
 `;

 setTimeout(()=>{
   generateMonthlyReport();
   generateYearlyReport();
 }, 0);
}


function generateMonthlyReport(){
 let map={};
 ["income","expense"].forEach(t=>{
  data[t].forEach(d=>{
   if(!d.date) return;
   let k = d.date.slice(0,7);
   if(!map[k]) map[k]={income:0,expense:0};
   map[k][t]+=d.amount;
  });
 });

 let labels=[],inc=[],exp=[],sav=[];
 let html=`<tr><th>Month</th><th>Income</th><th>Expense</th><th>Savings</th></tr>`;

 Object.keys(map).sort().forEach(k=>{
  const dt=new Date(k+"-01");
  const label=dt.toLocaleString("en-US",{month:"short",year:"numeric"});
  const s=map[k].income-map[k].expense;

  labels.push(label);
  inc.push(map[k].income);
  exp.push(map[k].expense);
  sav.push(s);

  html+=`<tr>
   <td>${label}</td>
   <td>₹${map[k].income}</td>
   <td>₹${map[k].expense}</td>
   <td>₹${s}</td>
  </tr>`;
 });

 document.getElementById('monthlyReport').innerHTML = html;
 drawChart("monthlyChart",labels,inc,exp,sav);
}

function generateYearlyReport(){
 let map={};
 ["income","expense"].forEach(t=>{
  data[t].forEach(d=>{
   if(!d.date) return;
   let y = d.date.slice(0,4);
   if(!map[y]) map[y]={income:0,expense:0};
   map[y][t]+=d.amount;
  });
 });

 let labels=[],inc=[],exp=[],sav=[];
 let html=`<tr><th>Year</th><th>Income</th><th>Expense</th><th>Savings</th></tr>`;

 Object.keys(map).sort().forEach(y=>{
  const s=map[y].income-map[y].expense;
  labels.push(y);
  inc.push(map[y].income);
  exp.push(map[y].expense);
  sav.push(s);

  html+=`<tr>
   <td>${y}</td>
   <td>₹${map[y].income}</td>
   <td>₹${map[y].expense}</td>
   <td>₹${s}</td>
  </tr>`;
 });

 document.getElementById('yearlyReport').innerHTML = html;
 drawChart("yearlyChart",labels,inc,exp,sav);
}

function drawChart(id, labels, inc, exp, sav){
 const el = document.getElementById(id);
 if(!el) return;

 // destroy old chart if exists
 if(charts[id]) charts[id].destroy();

 // Calculate totals for pie
 const totalIncome = inc.reduce((a,b)=>a+b,0);
 const totalExpense = exp.reduce((a,b)=>a+b,0);
 const totalSavings = sav.reduce((a,b)=>a+b,0);

 charts[id] = new Chart(el, {
  type: "pie",
  data: {
   labels: ["Income", "Expense", "Savings"],
   datasets: [{
    data: [totalIncome, totalExpense, totalSavings],
    backgroundColor: [
     "rgba(46,204,113,0.8)", // green
     "rgba(231,76,60,0.8)",  // red
     "rgba(52,152,219,0.8)"  // blue
    ]
   }]
  },
  options: {
   responsive: true,
   plugins: {
    legend: {
     position: "bottom"
    }
   }
  }
 });
}


function exportExcel(){
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.income),"Income");
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.expense),"Expense");
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.savings),"Savings");
 XLSX.writeFile(wb,"Finance_Report.xlsx");
}

updateUI();
</script>
</body>
</html>
